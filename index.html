<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Event Management System v2</title>
            <link rel="icon" type="image/svg+xml" href="/icons/favicon.svg" />
  <script>
    document.addEventListener('contextmenu', function(e) { e.preventDefault(); return false; });
    document.addEventListener('keydown', function(e) {
      if (e.key === 'F12' || e.keyCode === 123) { e.preventDefault(); e.stopPropagation(); return false; }
      if (e.ctrlKey && e.shiftKey && ['i','I','j','J','c','C'].includes(e.key)) { e.preventDefault(); e.stopPropagation(); return false; }
      if (e.ctrlKey && (e.key === 'u' || e.key === 'U')) { e.preventDefault(); e.stopPropagation(); return false; }
      if (e.ctrlKey && (e.key === 's' || e.key === 'S')) { e.preventDefault(); e.stopPropagation(); return false; }
    }, true);
    (function devtoolsDetect() {
      var threshold = 160;
      setInterval(function() {
        if (window.outerWidth - window.innerWidth > threshold || window.outerHeight - window.innerHeight > threshold) {
          document.body.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100vh;background:#0f1117;color:#ef4444;font-family:system-ui;font-size:18px;text-align:center;padding:2rem;">\u{1F512} Access Denied \u2014 Developer tools are not permitted on this system.</div>';
        }
      }, 1000);
    })();
    document.addEventListener('selectstart', function(e) { e.preventDefault(); return false; });
    document.addEventListener('dragstart', function(e) { e.preventDefault(); return false; });
  </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
