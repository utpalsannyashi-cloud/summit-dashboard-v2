<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Dark background matching app theme -->
  <rect width="32" height="32" rx="6" fill="#0f1117"/>
  <!-- Calendar body -->
  <rect x="5" y="8" width="18" height="15" rx="2" fill="none" stroke="#3B82F6" stroke-width="1.5"/>
  <!-- Calendar header line -->
  <line x1="5" y1="13" x2="23" y2="13" stroke="#3B82F6" stroke-width="1.5"/>
  <!-- Calendar binding pins -->
  <line x1="10" y1="6" x2="10" y2="10" stroke="#3B82F6" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="18" y1="6" x2="18" y2="10" stroke="#3B82F6" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Dot grid in calendar body -->
  <circle cx="10" cy="17" r="1" fill="#3B82F6"/>
  <circle cx="14" cy="17" r="1" fill="#3B82F6"/>
  <circle cx="10" cy="21" r="1" fill="#3B82F6"/>
  <circle cx="14" cy="21" r="1" fill="#3B82F6"/>
  <!-- v2.0 badge bottom-right -->
  <rect x="18" y="19" width="13" height="9" rx="2.5" fill="#3B82F6"/>
  <text x="24.5" y="26.5" font-family="system-ui,Arial,sans-serif" font-size="5.2" font-weight="700" fill="white" text-anchor="middle">v2.0</text>
</svg>